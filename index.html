<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thinking Out Loud</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000;
      --border: #222;
      --text: #ccc;
      --dim: #555;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
    }

    #app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top bar */
    #top-bar {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    #top-bar h1 {
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
    }

    /* Prompt selector */
    .prompt-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .prompt-card {
      background: #111;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.6rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.2s;
      max-width: 320px;
      text-align: left;
    }

    .prompt-card:hover {
      border-color: #444;
    }

    .prompt-card.selected {
      border-color: #00ff88;
      background: #0a2015;
    }

    .prompt-card:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .prompt-input {
      background: #111;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.6rem 0.8rem;
      border-radius: 4px;
      resize: none;
      width: 100%;
      max-width: 600px;
    }

    .prompt-input:focus {
      outline: none;
      border-color: #444;
    }

    .prompt-input:disabled {
      opacity: 0.3;
    }

    .ask-btn {
      background: #1a1a1a;
      border: 1px solid #444;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.5rem 2rem;
      border-radius: 4px;
      cursor: pointer;
      align-self: flex-start;
      transition: background 0.2s;
    }

    .ask-btn:hover:not(:disabled) {
      background: #333;
    }

    .ask-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Mode toggle */
    .mode-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .mode-toggle-group {
      display: flex;
      border: 1px solid #333;
      border-radius: 4px;
      overflow: hidden;
    }

    .mode-btn {
      background: #111;
      border: none;
      color: #888;
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.3rem 0.8rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .mode-btn:not(:last-child) {
      border-right: 1px solid #333;
    }

    .mode-btn.active {
      background: #222;
      color: #fff;
    }

    .mode-btn:hover:not(:disabled):not(.active) {
      background: #1a1a1a;
    }

    .mode-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Columns */
    #columns {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      padding: 1rem 2rem;
    }

    .column {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      min-height: 300px;
    }

    .column-header {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.05em;
    }

    .column-reasoning {
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.85rem;
      line-height: 1.6;
      min-height: 150px;
      padding-right: 0.5rem;
    }

    .column-reasoning::-webkit-scrollbar {
      width: 4px;
    }

    .column-reasoning::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 2px;
    }

    .scroll-indicator {
      text-align: center;
      font-size: 0.75rem;
      padding: 0.25rem;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .column-waveform {
      height: 60px;
      margin-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    /* Recent questions */
    .recent-questions {
      margin-bottom: 0.5rem;
    }

    .recent-label {
      font-size: 0.7rem;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.3rem;
    }

    .recent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .recent-item {
      background: #0a0a0a;
      border: 1px solid var(--border);
      color: #888;
      font-family: inherit;
      font-size: 0.75rem;
      padding: 0.3rem 0.7rem;
      border-radius: 3px;
      cursor: pointer;
      max-width: 280px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: border-color 0.2s, color 0.2s;
    }

    .recent-item:hover:not(:disabled) {
      border-color: #444;
      color: var(--text);
    }

    /* History panel */
    .history-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 380px;
      max-width: 90vw;
      height: 100vh;
      background: #0a0a0a;
      border-left: 1px solid var(--border);
      z-index: 100;
      overflow-y: auto;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.6);
    }

    .history-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .history-header h3 {
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
      flex: 1;
    }

    .history-close,
    .history-clear {
      background: none;
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.2rem 0.6rem;
      border-radius: 3px;
      cursor: pointer;
    }

    .history-close {
      font-size: 1.2rem;
      padding: 0.1rem 0.5rem;
    }

    .history-close:hover,
    .history-clear:hover {
      color: var(--text);
      border-color: #444;
    }

    .history-list {
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .history-item {
      background: #111;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.8rem 1rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .history-item:hover {
      border-color: #444;
    }

    .history-question {
      font-size: 0.85rem;
      color: var(--text);
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    .history-meta {
      font-size: 0.7rem;
      color: var(--dim);
      display: flex;
      gap: 0.75rem;
    }

    .history-mode {
      text-transform: capitalize;
      border: 1px solid #333;
      padding: 0.1rem 0.4rem;
      border-radius: 2px;
    }

    .history-empty {
      text-align: center;
      color: var(--dim);
      font-size: 0.85rem;
      padding: 2rem 0;
    }

    /* Error state in columns */
    .error-msg {
      color: #ff4444;
      font-style: italic;
      opacity: 0.8;
    }

    .column.has-error {
      border-color: #552222;
      background: #0a0505;
    }

    /* State label colors */
    #state-label.checking { color: #ffaa00; }
    #state-label.error { color: #ff4444; }
  </style>
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <h1>Thinking Out Loud</h1>
    </header>
    <main id="columns"></main>
  </div>
  <script type="module" src="./index.js"></script>
</body>
</html>
