<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thinking Out Loud</title>
</head>
<body>
  <div id="app">
    <section id="question-block" aria-label="Question">
      <div class="q-anchor" id="q-anchor">Question locked</div>
      <div class="q-meta">
        <span>Q / <b id="q-session">000</b></span>
        <span>Source <b id="q-source">—</b></span>
        <span>Three voices</span>
      </div>
      <div class="q-text" id="q-text">Select a question to begin.</div>
      <div class="q-hint">/ change question</div>
    </section>

    <div id="stage">
      <main id="columns"></main>
      <aside id="history-dock"></aside>
    </div>

    <footer id="tool-strip">
      <div class="tool-cell">TOL / <b id="t-session">000</b></div>
      <div class="tool-cell">State <b id="t-state">Idle</b></div>
      <div class="tool-cell">Order <b id="t-order">—</b></div>
      <div class="tool-cell">Elapsed <b id="t-elapsed">00:00</b></div>
      <div class="tool-cell">Wave <b id="t-wave">—</b></div>
      <div class="tool-cell tool-grow" id="t-message"></div>
      <button class="stop-btn" id="stop-btn" type="button">■ Stop</button>
    </footer>
  </div>

  <div id="question-palette" class="overlay-host"></div>
  <div id="waveform-picker" class="overlay-host"></div>

  <script type="module" src="./index.js"></script>
</body>
</html>
